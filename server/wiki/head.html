<!-- Pasted into the wiki's Administration -> Theme -> Code Injection -> Head HTML
     Injection. Wiki.js writes its blue into the page itself; this turns the
     phone browser bar, the Windows tile and the Safari pinned tab purple like
     the site. The icons themselves are the files in server/wiki/assets/.
     Wiki.js 2 writes its og:image empty and before this injection, where
     Discord takes it, so nginx fills it in (nginx-og.conf); the tags below
     add the size of that picture and the large preview. -->
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<script>
  [['meta[name="theme-color"]', 'content', '#9b59b6'],
   ['meta[name="msapplication-TileColor"]', 'content', '#0e0e11'],
   ['link[rel="mask-icon"]', 'color', '#9b59b6']].forEach(function (item) {
    var element = document.querySelector(item[0]);
    if (element) element.setAttribute(item[1], item[2]);
  });
</script>
