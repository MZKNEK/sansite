# Link previews of the wiki, included in the wiki's nginx site, in the location
# that passes to Wiki.js (proxy_pass); see Wiki in the README. Wiki.js 2 writes
# an empty og:image and its blue theme-color into every page, and Discord takes
# the first og:image and the theme-color for the stripe of the preview, so both
# are replaced on the way out: the fixed picture wiki-og.png from sanakan.pl and
# the site's purple.
#
# sub_filter works only on answers that are not compressed, hence the header
# below; Cloudflare still compresses them for visitors. A location with its own
# proxy_set_header no longer inherits the ones of the server block, so this goes
# where the other proxy_set_header lines of the wiki are.
proxy_set_header Accept-Encoding "";
sub_filter_once on;
sub_filter '<meta property="og:image">' '<meta property="og:image" content="https://sanakan.pl/wiki-og.png">';
sub_filter '<meta name="theme-color" content="#1976d2">' '<meta name="theme-color" content="#9b59b6">';
