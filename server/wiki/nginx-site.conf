# The wiki's server block, /etc/nginx/sites-available/wiki (enabled by the
# link sites-enabled/wiki): Wiki.js 2 on 127.0.0.1:3000 (bindIP and port in
# /var/www/wiki/config.yml), behind Cloudflare over https with the same Origin
# Certificate as the site (site.conf). The visitors' own addresses come from
# sanakan-realip.conf (conf.d), so X-Real-IP is the visitor, not Cloudflare.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 80;
    listen [::]:80;
    server_name wiki.sanakan.pl;

    ssl_certificate /etc/ssl/cloudflare/sanakan.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sanakan.key;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # link preview picture and purple (nginx-og.conf)
        include snippets/wiki-og.conf;
    }
}
