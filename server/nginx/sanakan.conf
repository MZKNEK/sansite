# Site rules, included in the server block of the nginx site (site.conf, which
# goes to /etc/nginx/sites-available/default):
#   include snippets/sanakan.conf;
# Goes to /etc/nginx/snippets/ together with sanakan-headers.conf. The
# visitors' own addresses behind Cloudflare are set for every site of the
# server in sanakan-realip.conf (conf.d).

include snippets/sanakan-headers.conf;

# The site's own log in the format of sanakan-log.conf (conf.d), read every
# 10 seconds by inc/check-site.php. logrotate's nginx rule (*.log) rotates it.
access_log /var/log/nginx/sanakan-access.log sanakan_diag;

# The state of nginx and of the PHP-FPM pool, only for the server itself:
# inc/check-site.php asks them over 127.0.0.1. fpm-status also needs
# pm.status_path = /fpm-status in the pool (README). /run/php/php-fpm.sock is
# the link Debian and Ubuntu keep to the socket of the PHP version installed,
# so a newer PHP needs no change here; site.conf passes PHP to the same one.
location = /nginx-status {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    allow ::1;
    deny all;
}

location = /fpm-status {
    access_log off;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}

# The CSS/JS and picture locations below set headers of their own, so nginx
# drops the ones of the server block there: they include the security headers
# again and repeat the Access-Control-Allow-Origin of the site's server block.

# the configuration and the data the site writes, never served
location ^~ /inc/ {
    deny all;
}

# the pictures of the bot's cards for the croppers, which cron mirrors from
# the bot's repository into inc/data/pw/ (inc/pw.php): served from there at
# /pw/ (the rewrite with break serves the file in this location, so the rule
# of inc/ above does not apply), a day in the browser's cache, as a file can
# change under its name
location ^~ /pw/ {
    include snippets/sanakan-headers.conf;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=86400" always;
    rewrite ^/pw/(.*)$ /inc/data/pw/$1 break;
}

# the folders of the accounts in the gallery: never straight from the disk, as
# their names have the account's ID; i/index.php gives their files out by the
# random name of their links, i/u/<token>/<file> or in a subfolder (before the
# picture location;
# nginx takes a regular expression with { } only in quotes)
location ^~ /i/users/ {
    return 404;
}

# the private folder of the gallery: also never straight from the disk;
# i/index.php gives its files out only to those who may see them
location ^~ /i/private/ {
    rewrite ^ /i/index.php last;
}

location ~ "^/i/u/[0-9a-f]{16}/" {
    rewrite ^ /i/index.php last;
}

# short links to commands: /cmd/daily goes to /cmd/#daily, through cmd/index.php,
# which asks for a login instead where the command is a moderator or debug one
# the visitor may not see; the real folder cmd/changes/ stays as it is, and so
# does its old address cmd/zmiany/, which sends there itself (the capture of
# the rewrite, unlike a variable, is escaped in the arguments)
location ~ ^/cmd/(?!(?:changes|zmiany)(?:/|$))[^/.]+/?$ {
    rewrite ^/cmd/([^/.]+)/?$ /cmd/index.php?go=$1 last;
}

# Skalpelator and USkalpelator, built by Vite from apps/ into skalpel/ and
# uskalpel/ (before the .html, CSS/JS and picture locations, which would give
# them the site's policy): their own security headers, the page asked for every
# time and the files of assets/, whose names carry a hash of their content,
# kept for a year. assets/ has the types listed itself, as nginx's mime.types
# may lack .mjs or .wasm, and a module script sent as anything but JavaScript
# does not run with nosniff. The policy of USkalpelator alone allows eval
# (sanakan-app-headers.conf says why); set here, in the server block, as the
# rewrite directives of a location are not passed to the one nested in it.
set $sanakan_app_eval "";
if ($uri ~ ^/uskalpel/) {
    set $sanakan_app_eval " 'unsafe-eval'";
}

location ~ ^/u?skalpel/ {
    include snippets/sanakan-app-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;

    location ~ ^/u?skalpel/assets/ {
        types {
            text/javascript js mjs;
            text/css css;
            application/wasm wasm;
            font/woff2 woff2;
            image/png png;
            image/webp webp;
            image/svg+xml svg;
        }
        include snippets/sanakan-app-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}

error_page 404 /404.html;
location = /404.html {
    internal;
    include snippets/sanakan-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# the same for an address nginx refuses (inc/, the dot files, the state of
# nginx and PHP-FPM asked from outside)
error_page 403 /403.html;
location = /403.html {
    internal;
    include snippets/sanakan-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# and for PHP-FPM down or too slow (502, 504) or any other failure of nginx's
# own; a page PHP answers with an error status keeps its own body (the JSON of
# the panel and the gallery), as fastcgi_intercept_errors stays off
error_page 500 502 503 504 /500.html;
location = /500.html {
    internal;
    include snippets/sanakan-headers.conf;
    add_header Cache-Control "no-store" always;
}

# the web app manifest with the icons: its type given here, as nginx's
# mime.types may lack .webmanifest; kept a day, like the icons it lists
location = /site.webmanifest {
    include snippets/sanakan-headers.conf;
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}

# the service worker with the offline page (sw.js, offline.html): asked for
# every time, not kept a year as the other scripts (below), so a new version
# reaches the browsers at once; the offline page goes as the other .html
location = /sw.js {
    include snippets/sanakan-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# the static pages (index.html, privacy/): with no Cache-Control a browser
# guesses how long to keep them and may show an old page that links the old
# CSS and JS; no-cache makes it ask every time, a 304 when nothing changed
location ~* \.html$ {
    include snippets/sanakan-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# CSS and JS are linked with a ?v= version everywhere, so a change gets a new
# address and browsers may keep them for a year
location ~* \.(?:css|js)$ {
    include snippets/sanakan-headers.conf;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# a PNG, JPG, GIF, AVIF, WebM or MP4 of the gallery that is not there: i/index.php
# sends the old link of a picture changed to WebP, or of a film changed to
# WebM, on to the new one (inc/gallery.php), anything else gets a 404 (before
# the picture location, which it is otherwise like)
location ~* ^/i/.+\.(?:png|jpe?g|gif|avif|webm|mp4)$ {
    include snippets/sanakan-headers.conf;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri @gallery-moved;
}

location @gallery-moved {
    rewrite ^ /i/index.php last;
}

# pictures, videos, icons and fonts: a gallery file can be replaced under the
# same name, so only a day
location ~* \.(?:png|jpe?g|gif|webp|avif|webm|mp4|svg|ico|woff2)$ {
    include snippets/sanakan-headers.conf;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}
