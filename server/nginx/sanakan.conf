# Site rules, included in the server block of the nginx site
# (/etc/nginx/sites-available/default):
#   include snippets/sanakan.conf;
# Goes to /etc/nginx/snippets/ together with sanakan-headers.conf.

include snippets/sanakan-headers.conf;

# Every request goes through Cloudflare, so nginx would see only Cloudflare's
# addresses. From these ranges it takes the visitor's own address from
# CF-Connecting-IP instead (logs, allow/deny). Anyone else sending the header
# is ignored. The list: https://www.cloudflare.com/ips/ (CLOUDFLARE_RANGES in
# inc/diag.php is the same, the panel warns when the log still shows these).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# The site's own log in the format of sanakan-log.conf (conf.d), read every
# 10 seconds by inc/check-site.php. logrotate's nginx rule (*.log) rotates it.
access_log /var/log/nginx/sanakan-access.log sanakan_diag;

# The state of nginx and of the PHP-FPM pool, only for the server itself:
# inc/check-site.php asks them over 127.0.0.1. fpm-status also needs
# pm.status_path = /fpm-status in the pool (README), and the socket below must
# be the one of the site's PHP location.
location = /nginx-status {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    allow ::1;
    deny all;
}

location = /fpm-status {
    access_log off;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.1-fpm.sock;
}

# The CSS/JS and picture locations below set headers of their own, so nginx
# drops the ones of the server block there: they include the security headers
# again and repeat the Access-Control-Allow-Origin of the site's server block.

# the configuration and the data the site writes, never served
location ^~ /inc/ {
    deny all;
}

# the folders of the accounts in the gallery: never straight from the disk, as
# their names have the account's ID; i/index.php gives their files out by the
# random name of their links, i/u/<token>/<file> or in a subfolder (before the
# picture location;
# nginx takes a regular expression with { } only in quotes)
location ^~ /i/users/ {
    return 404;
}

# the private folder of the gallery: also never straight from the disk;
# i/index.php gives its files out only to those who may see them
location ^~ /i/private/ {
    rewrite ^ /i/index.php last;
}

location ~ "^/i/u/[0-9a-f]{16}/" {
    rewrite ^ /i/index.php last;
}

# short links to commands: /cmd/daily goes to /cmd/#daily; the real folder
# cmd/zmiany/ stays as it is
location ~ ^/cmd/(?!zmiany(?:/|$))(?<command>[^/.]+)/?$ {
    return 302 /cmd/#$command;
}

error_page 404 /404.html;
location = /404.html {
    internal;
}

# CSS and JS are linked with a ?v= version everywhere, so a change gets a new
# address and browsers may keep them for a year
location ~* \.(?:css|js)$ {
    include snippets/sanakan-headers.conf;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# a PNG, JPG or GIF of the gallery that is not there: i/index.php sends the
# old link of a picture changed to WebP on to it (inc/gallery.php), anything
# else gets a 404 (before the picture location, which it is otherwise like)
location ~* ^/i/.+\.(?:png|jpe?g|gif)$ {
    include snippets/sanakan-headers.conf;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri @gallery-moved;
}

location @gallery-moved {
    rewrite ^ /i/index.php last;
}

# pictures, videos, icons and fonts: a gallery file can be replaced under the
# same name, so only a day
location ~* \.(?:png|jpe?g|gif|webp|avif|webm|mp4|svg|ico|woff2)$ {
    include snippets/sanakan-headers.conf;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}
