# Site rules, included in the server block of the nginx site
# (/etc/nginx/sites-available/default):
#   include snippets/sanakan.conf;
# Goes to /etc/nginx/snippets/ together with sanakan-headers.conf.

include snippets/sanakan-headers.conf;

# The CSS/JS and picture locations below set headers of their own, so nginx
# drops the ones of the server block there: they include the security headers
# again and repeat the Access-Control-Allow-Origin of the site's server block.

# the configuration and the data the site writes, never served
location ^~ /inc/ {
    deny all;
}

# short links to commands: /cmd/daily goes to /cmd/#daily; the real folder
# cmd/zmiany/ stays as it is
location ~ ^/cmd/(?!zmiany(?:/|$))(?<command>[^/.]+)/?$ {
    return 302 /cmd/#$command;
}

error_page 404 /404.html;
location = /404.html {
    internal;
}

# CSS and JS are linked with a ?v= version everywhere, so a change gets a new
# address and browsers may keep them for a year
location ~* \.(?:css|js)$ {
    include snippets/sanakan-headers.conf;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# pictures, videos, icons and fonts: a gallery file can be replaced under the
# same name, so only a day
location ~* \.(?:png|jpe?g|gif|webp|webm|svg|ico|woff2)$ {
    include snippets/sanakan-headers.conf;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}
