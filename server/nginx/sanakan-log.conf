# Format of the site's access log, one JSON object per request, read by
# inc/check-site.php for the "Dostępność strony" card of the admin panel.
# log_format is allowed only in the http block, so this file goes to
# /etc/nginx/conf.d/, which nginx.conf includes there; sanakan.conf uses it.
#
# t: time with milliseconds, ip: the visitor (Cloudflare's address without the
# real_ip lines of sanakan.conf), s: status, rt: whole request time, ut: time
# PHP took ("" for files nginx served itself), cc: country from Cloudflare.
log_format sanakan_diag escape=json
    '{"t":"$msec","ip":"$remote_addr","m":"$request_method","u":"$request_uri",'
    '"s":"$status","rt":"$request_time","ut":"$upstream_response_time",'
    '"ua":"$http_user_agent","cc":"$http_cf_ipcountry"}';
