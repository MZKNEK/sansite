# Security headers for every response of the site. nginx forgets the add_header
# lines of the server block in a location that has add_header of its own, so
# those locations include this file again (see sanakan.conf).
#
# The policy allows what the pages use: their own files (fonts included), inline
# styles and the Discord avatars of logged-in accounts. Scripts come only from
# the site's own files, never inline, so a text that slipped through unescaped
# (the panel shows paths and user agents from the log) still cannot run.
# Sound and films may also come from blob: addresses, which only a page's own
# script can make, so a player can play the visitor's own files in the browser,
# and so may pictures, so a page can cut many out of one file it fetched.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://cdn.discordapp.com; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# browsers remember for a year to use only https
add_header Strict-Transport-Security "max-age=31536000" always;
# an easter egg for whoever reads the headers: the password is a command of
# the Safeguard's terminal (js/netsphere.js), and a find of its register
add_header X-Safeguard "LV.9; gen-terminala-sieciowego=brak" always;
