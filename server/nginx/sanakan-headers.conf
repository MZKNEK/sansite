# Security headers for every response of the site. nginx forgets the add_header
# lines of the server block in a location that has add_header of its own, so
# those locations include this file again (see sanakan.conf).
#
# The policy allows what the pages use: their own files (fonts included), inline
# styles and the Discord avatars of logged-in accounts. Scripts come only from
# the site's own files, never inline, so a text that slipped through unescaped
# (the panel shows paths and user agents from the log) still cannot run.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://cdn.discordapp.com; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# browsers remember for a year to use only https
add_header Strict-Transport-Security "max-age=31536000" always;
