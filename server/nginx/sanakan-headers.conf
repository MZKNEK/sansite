# Security headers for every response of the site. nginx forgets the add_header
# lines of the server block in a location that has add_header of its own, so
# those locations include this file again (see sanakan.conf).
#
# The policy allows what the pages use: their own files and inline scripts and
# styles, Google Fonts and the Discord avatars in the gallery and the panel.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cdn.discordapp.com; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# browsers remember for a year to use only https
add_header Strict-Transport-Security "max-age=31536000" always;
