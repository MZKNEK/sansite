# The cache of the bot's cards that sanakan.conf passes on from Shinden's CDN
# at /profilator/cards/ (Profilator plays an animated one, which needs its
# bytes, and Shinden's CDN lets no page read them). proxy_cache_path is
# allowed only in the http block, so this file goes to /etc/nginx/conf.d/,
# like sanakan-log.conf. /var/lib/nginx is the folder of nginx's own files on
# Debian and Ubuntu; nginx makes the cache folder in it.
proxy_cache_path /var/lib/nginx/sanakan-cards levels=1:2 keys_zone=sanakan_cards:2m max_size=256m inactive=7d use_temp_path=off;
