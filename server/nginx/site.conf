# The site's server block, /etc/nginx/sites-available/default (enabled by the
# link sites-enabled/default).
#
# Cloudflare asks the server over https, with the Cloudflare Origin Certificate
# of sanakan.pl and *.sanakan.pl in /etc/ssl/cloudflare/ (SSL "Full (strict)"
# for this server's names by a Cloudflare configuration rule, the zone's own mode
# stays for the subdomains elsewhere; docs/server.md, nginx). Port 80 stays for the
# server itself: the availability checks ask http://127.0.0.1
# (DIAG_LOCAL_ORIGIN), nginx-status and fpm-status. The firewall lets only Cloudflare reach port 443 and nobody
# port 80 (server/ufw-cloudflare.sh).
#
# The firewall knows Cloudflare's network, not the zone, so another Cloudflare
# account could point a name of its own at this server and pass by the WAF and
# the blocking of sanakan.pl. Over https only the server's own names are
# answered: any other name, or none, has its handshake refused by the first
# block. Port 80, which only the server itself reaches, takes any name.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name sanakan.pl www.sanakan.pl;

    ssl_certificate /etc/ssl/cloudflare/sanakan.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sanakan.key;

    # Authenticated Origin Pulls with a certificate of this zone (Cloudflare →
    # SSL/TLS → Origin Server, zone-level, with an own certificate; docs/server.md,
    # nginx): only the zone sanakan.pl then gets in, whatever name it sends.
    # Cloudflare's shared certificate would only prove Cloudflare's network.
    # Turned on once the zone sends the certificate, or every request fails:
    # ssl_client_certificate /etc/ssl/cloudflare/sanakan-aop-ca.pem;
    # ssl_verify_client on;

    # no nginx version in the headers and on its error pages
    server_tokens off;

    root /var/www/html;
    index index.php index.html;

    add_header Access-Control-Allow-Origin "*";

    # .env, .git, .htaccess and the like are never served; the site has none,
    # this only makes sure (the first regular expression, so before the CSS/JS
    # and picture locations of sanakan.conf)
    location ~ /\.(?!well-known/) {
        deny all;
    }

    include snippets/sanakan.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    # /run/php/php-fpm.sock is the link to the socket of the PHP version
    # installed (sanakan.conf passes fpm-status to the same one)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
