# Security headers of Skalpelator and USkalpelator (/skalpel/, /uskalpel/,
# built from apps/), included by their location in sanakan.conf instead of
# sanakan-headers.conf. Only the Content-Security-Policy differs: the apps load
# a picture from any link the visitor gives (img-src and connect-src https:, as
# the crop reads its pixels with fetch; the card frames are the site's own,
# /pw/), read local files as data: and blob:
# addresses, crop in a worker of their own, and USkalpelator removes the
# background with onnxruntime, whose script and WebAssembly come from the CDN
# of IMG.LY as blob: addresses ('wasm-unsafe-eval' compiles WebAssembly, it
# does not allow eval of scripts). USkalpelator alone also gets 'unsafe-eval'
# through $sanakan_app_eval (set in sanakan.conf): ndarray, which IMG.LY's
# background removal is built on, makes its classes with new Function.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:$sanakan_app_eval; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self'; connect-src 'self' data: blob: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# browsers remember for a year to use only https
add_header Strict-Transport-Security "max-age=31536000" always;
