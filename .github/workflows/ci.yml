name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the server's PHP, and the oldest the code keeps working on
        php: ['8.5', '8.1']
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, gd
          ini-values: error_reporting=-1, display_errors=On
          coverage: none

      - name: Lint every PHP file
        run: php tests/lint.php

      - name: Run the tests
        run: php tests/run.php

      - name: HTTP smoke test
        run: php tests/http.php

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # the server's Node.js (the wiki runs on it)
          node-version: '22'

      - name: Check the JavaScript
        run: |
          git ls-files '*.js' | grep -v 'swagger-ui' | while read -r file; do
            node --check "$file" || exit 1
          done
