name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, gd
          coverage: none

      - name: Lint every PHP file
        run: php tests/lint.php

      - name: Run the tests
        run: php tests/run.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the JavaScript
        run: |
          git ls-files '*.js' | grep -v 'swagger-ui' | while read -r file; do
            node --check "$file" || exit 1
          done
